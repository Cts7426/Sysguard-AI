[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sysguard-ai"
version = "0.1.0"
description = "Local system and process metrics collector for learning OS and ML engineering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["psutil>=7.0,<8"]

[project.scripts]
sysguard = "sysguard.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-psutil>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sysguard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sysguard --cov-report=term-missing"
markers = ["live: stable integration checks using the host collector"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/sysguard"]
